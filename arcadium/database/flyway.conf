# =============================================================================
# Arcadium — ACE5 · Milestone M2 · Task T6
# Configurazione Flyway per il versioning dello schema PostgreSQL.
#
# La password NON e' versionata: si passa via variabile d'ambiente
# FLYWAY_PASSWORD. Anche url e user sono override-abili via env (FLYWAY_URL,
# FLYWAY_USER) per ambienti diversi (locale, staging del cliente).
# =============================================================================

flyway.url=jdbc:postgresql://localhost:5432/arcadium
flyway.user=arcadium
# flyway.password -> variabile d'ambiente FLYWAY_PASSWORD (mai in chiaro qui)

# Migrazioni versionate (migrations/V__*.sql) e seed ripetibili (seed/R__*.sql)
flyway.locations=filesystem:migrations,filesystem:seed

flyway.encoding=UTF-8
flyway.validateMigrationNaming=true
flyway.baselineOnMigrate=false
