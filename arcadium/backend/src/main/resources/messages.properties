# =============================================================================
# Arcadium - ACE5 - M4-T4 - Messaggi server (italiano, default e fallback)
#
# Qui vivono i testi dei messaggi di errore: NON sono nel codice Java. La lingua
# viene scelta a runtime dall'header Accept-Language (vedi I18nConfig); se manca
# una chiave nella lingua richiesta, si ricade su questo file (italiano).
# Codifica UTF-8 (impostata in application.yml): gli accenti si scrivono diretti.
#
# -----------------------------------------------------------------------------
# REGOLA OBBLIGATORIA (M6-T4): NESSUN APOSTROFO NEI VALORI.
# -----------------------------------------------------------------------------
# Spring passa il testo da MessageFormat SOLO quando il messaggio ha argomenti
# (ApiException con args, e SEMPRE i messaggi di validazione dei FieldError).
# Per MessageFormat l'apostrofo singolo apre una sezione "letterale": un solo
# apostrofo in un messaggio con {0} fa stampare {0} alla lettera, due apostrofi
# se li mangiano entrambi. Il raddoppio ('') non e' una soluzione generale,
# perche' nei messaggi SENZA argomenti MessageFormat non viene applicato e i due
# apostrofi si vedrebbero a schermo.
#
# Soluzione adottata: i valori non contengono apostrofi. Si usano gli accenti
# veri (e' -> è, gia' -> già, piu' -> più) e si riformula dove servirebbe un
# apostrofo (es. "L'email è obbligatoria" -> "Indirizzo email obbligatorio").
# Se un giorno un apostrofo fosse inevitabile in un messaggio CON argomenti,
# va raddoppiato ('') e solo li.
# =============================================================================

