# =============================================================================
# Arcadium - ACE5 - M4-T4 - Messaggi server (italiano, default e fallback)
#
# Qui vivono i testi dei messaggi d'errore: NON sono nel codice Java. La lingua
# viene scelta a runtime dall'header Accept-Language (vedi I18nConfig); se manca
# una chiave nella lingua richiesta, si ricade su questo file (italiano).
# Codifica UTF-8 (impostata in application.yml) per gestire gli accenti.
# =============================================================================

# --- Errori applicativi (lanciati da AuthService come ApiException) ---
error.username.taken=Username gia' in uso
error.email.taken=Email gia' in uso
error.credentials.invalid=Credenziali non valide

# --- Accesso negato (JwtAuthenticationEntryPoint) ---
error.auth.required=Autenticazione richiesta

# --- Messaggio generale che accompagna gli errori di validazione (400) ---
error.validation=La richiesta contiene uno o piu' campi non validi

# --- Validazione: codici GENERICI per tipo di vincolo (ultimo fallback) ---
# Spring, per ogni campo non valido, prova in ordine codici sempre piu' generici;
# questi valgono quando non c'e' un codice specifico per il campo.
NotBlank=Il campo e' obbligatorio
Email=L'indirizzo email non e' valido
Size=Lunghezza del campo non valida
Pattern=Formato del campo non valido

# --- Validazione: codici SPECIFICI per campo (hanno la precedenza) ---
# Formato: <Vincolo>.<oggetto>.<campo>  (es. l'oggetto di RegisterRequest e' "registerRequest")
NotBlank.registerRequest.username=Lo username e' obbligatorio
NotBlank.registerRequest.email=L'email e' obbligatoria
NotBlank.registerRequest.password=La password e' obbligatoria
NotBlank.loginRequest.username=Lo username e' obbligatorio
NotBlank.loginRequest.password=La password e' obbligatoria
Email.registerRequest.email=L'indirizzo email non e' valido
Size.registerRequest.password=La password deve avere tra 8 e 100 caratteri
Size.password=La password deve avere tra 8 e 100 caratteri
Pattern.registerRequest.preferredLanguage=La lingua preferita deve essere 'it' o 'en'
Pattern.preferredLanguage=La lingua preferita deve essere 'it' o 'en'

# --- Catalogo (M4-T5): parametri di filtro non validi (400) ---
# Portano l'argomento {0} = valore ricevuto. Nessun apice singolo nei testi:
# con argomenti il messaggio e' processato da MessageFormat.
error.catalog.platform.invalid=Piattaforma non valida: {0} (valori ammessi: windows, mac, linux)
error.catalog.status.invalid=Stato non valido: {0} (valori ammessi: free, paid, discounted)
error.catalog.sort.invalid=Campo di ordinamento non valido: {0}
# --- Dettaglio gioco (M4-T6): gioco inesistente (404) ---
# {0} = appId richiesto. Con argomenti il testo passa da MessageFormat: niente apici singoli.
error.game.notFound=Gioco non trovato: {0}
# --- Wishlist (M4-T7): esiti previsti (409 / 404) ---
error.wishlist.alreadyExists=Il gioco e' gia' nella tua wishlist: {0}
error.wishlist.notFound=Il gioco non e' nella tua wishlist: {0}
# --- Backlog (M4-T8): esiti previsti (409 / 404 / 400) ---
# {0} = appId; con argomenti il testo passa da MessageFormat -> niente apici singoli.
error.backlog.alreadyExists=Gioco duplicato nel tuo backlog: {0}
error.backlog.notFound=Gioco non presente nel tuo backlog: {0}
error.backlog.status.invalid=Stato del backlog non valido: {0} (valori ammessi: mai_giocato, in_corso, finito, abbandonato)
# vincolo sul tempo di gioco nel PATCH del backlog (@Min)
Min.backlogUpdateRequest.playtimeMinutes=Il tempo di gioco deve essere zero o positivo
Min=Valore troppo piccolo
