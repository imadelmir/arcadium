# =============================================================================
# Arcadium — ACE5 · Milestone M4
# Configurazione del backend Spring Boot: connessione a PostgreSQL, Flyway,
# JPA, health endpoint (M4-T1), sicurezza JWT (M4-T3) e messaggi localizzati
# (M4-T4).
#
# Le credenziali e i segreti NON sono nel codice: arrivano da variabili
# d'ambiente. DB_* come nell'ETL; JWT_SECRET per la firma dei token.
# =============================================================================

spring:
  application:
    name: arcadium-backend

  # --- Messaggi localizzati (M4-T4) ---
  # Carica i bundle messages*.properties dal classpath. UTF-8 per gli accenti;
  # fallback-to-system-locale=false cosi', se una chiave manca nella lingua
  # richiesta, si ricade su messages.properties (italiano) e non sul locale del SO.
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  # --- Connessione a PostgreSQL (stesse chiavi env dell'ETL) ---
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:arcadium}
    username: ${DB_USER:arcadium}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  # --- JPA / Hibernate ---
  # ddl-auto=validate: lo schema e' gestito da Flyway (M2/M3), non da Hibernate,
  # che all'avvio confronta le entita' (M4-T2) con lo schema reale.
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  # --- Flyway ---
  # Esegue all'avvio le STESSE migrazioni versionate di M2/M3 (non una copia):
  # la history flyway_schema_history e' gia' popolata, quindi Flyway valida.
  flyway:
    enabled: true
    locations: >-
      filesystem:${ARCADIUM_DB_MIGRATIONS:../database/migrations},
      filesystem:${ARCADIUM_DB_SEED:../database/seed}
    baseline-on-migrate: false
    validate-migration-naming: true
    out-of-order: true

# --- Sicurezza (M4-T3) ---
# Segreto di firma JWT: OBBLIGATORIO in staging via env JWT_SECRET, almeno 32
# caratteri (256 bit, requisito HS256). Il default sottostante e' solo per lo
# sviluppo locale e NON va usato altrove.
# expiration in millisecondi (default 24h). cors.allowed-origins: lista separata
# da virgole delle origini del frontend consentite.
arcadium:
  # --- Frontend (M4-T17) ---
  # Base URL del frontend Next.js: serve a comporre il link di reset password
  # (${arcadium.frontend.base-url}/reimposta-password?token=...) inviato nel
  # log/email. Default: dev locale.
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-secret-change-me-please-at-least-32-bytes-long}
      expiration: ${JWT_EXPIRATION:86400000}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    # --- Recupero password (M4-T17) ---
    # token-ttl: durata di validita' del link di reset (default 30 minuti).
    # expose-token: SOLO dev/demo. A true il token viene incluso nella risposta
    #   di /forgot-password cosi' da provare il flusso senza un server email.
    #   In produzione DEVE restare false: il link va inviato via email.
    password-reset:
      token-ttl: ${PASSWORD_RESET_TTL:30m}
      expose-token: ${PASSWORD_RESET_EXPOSE_TOKEN:false}

  # --- Funzioni future-ready dietro feature flag (M4-T13) ---
  # Notifiche di calo prezzo: SPENTE di default. A false non si abilita lo
  # scheduling e i bean del motore non vengono creati (scaffolding inerte).
  # L'attivazione avra' senso con i prezzi aggiornati dalla sync Steam (M4-T16).
  # --- Integrazione Steam (M4-T16) ---
  # api-key da ambiente (STEAM_API_KEY); assente = sync non disponibile.
  steam:
    api-key: ${STEAM_API_KEY:}
    realm: ${STEAM_REALM:http://localhost:8080}
    return-url: ${STEAM_RETURN_URL:http://localhost:3000/steam/callback}
  notifications:
    price-drop:
      enabled: ${PRICE_DROP_NOTIFICATIONS_ENABLED:false}
      cron: ${PRICE_DROP_NOTIFICATIONS_CRON:0 0 3 * * *}

# --- Actuator ---
# /actuator/health resta pubblico (permitAll nella SecurityConfig) come sonda,
# ma i dettagli si mostrano solo a un utente autorizzato (M4-T1 -> ristretto qui).
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

# --- Documentazione API: OpenAPI / Swagger (M4-T12) ---
# springdoc espone la descrizione OpenAPI e la Swagger UI; qui si fissano i path
# e un ordinamento leggibile. In produzione si possono disattivare (enabled=false).
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# --- HTTP server ---
server:
  port: ${SERVER_PORT:8080}


# =============================================================================
# Profilo "prod" (jar / ambiente demo) — solo override di Flyway.
# -----------------------------------------------------------------------------
# Nel jar impacchettato i percorsi "filesystem:../database/..." non esistono
# piu': qui Flyway legge le STESSE migrazioni e seed dal CLASSPATH, dove la
# build Maven (maven-resources-plugin) li ha copiati sotto db/migration e
# db/seed. Tutte le altre chiavi flyway (enabled, baseline, naming) ereditano
# dalla configurazione di default qui sopra.
#
# Attivazione: SPRING_PROFILES_ACTIVE=prod  (oppure --spring.profiles.active=prod).
# In sviluppo da IDE NON si attiva: resta il default filesystem.
# =============================================================================
---
spring:
  config:
    activate:
      on-profile: prod
  flyway:
    locations: classpath:db/migration,classpath:db/seed
