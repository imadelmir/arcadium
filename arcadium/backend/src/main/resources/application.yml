# =============================================================================
# Arcadium — ACE5 · Milestone M4
# Configurazione del backend Spring Boot: connessione a PostgreSQL, Flyway,
# JPA, health endpoint (M4-T1), sicurezza JWT (M4-T3) e messaggi localizzati
# (M4-T4).
# =============================================================================

spring:
  application:
    name: arcadium-backend

  # --- Messaggi localizzati (M4-T4) ---
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  # --- Connessione a PostgreSQL (stesse chiavi env dell'ETL) ---
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:arcadium}
    username: ${DB_USER:arcadium}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  # --- JPA / Hibernate ---
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  # --- Flyway ---
  flyway:
    enabled: true
    locations: >-
      filesystem:${ARCADIUM_DB_MIGRATIONS:../database/migrations},
      filesystem:${ARCADIUM_DB_SEED:../database/seed}
    baseline-on-migrate: false
    validate-migration-naming: true

# --- Sicurezza (M4-T3) ---
arcadium:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-secret-change-me-please-at-least-32-bytes-long}
      expiration: ${JWT_EXPIRATION:86400000}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# --- Actuator ---
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

# --- HTTP server ---
server:
  port: ${SERVER_PORT:8080}

