# =============================================================================
# Arcadium - ACE5 - M4-T4 - Server messages (English)
# Loaded when Accept-Language resolves to "en". Missing keys fall back to
# messages.properties (Italian). Keep keys aligned with the Italian file.
#
# -----------------------------------------------------------------------------
# MANDATORY RULE (M6-T4): NO APOSTROPHES IN VALUES.
# -----------------------------------------------------------------------------
# Spring runs a message through MessageFormat only when it has arguments
# (ApiException with args, and ALWAYS the FieldError validation messages).
# In MessageFormat a single quote starts a literal section: one apostrophe in a
# message containing {0} makes {0} print verbatim. Doubling ('') is not a
# general fix either, because messages WITHOUT arguments skip MessageFormat and
# the two quotes would show up on screen.
# Adopted solution: values contain no apostrophes (rephrase instead, e.g.
# "this user's library" -> "the library of this user").
# =============================================================================

