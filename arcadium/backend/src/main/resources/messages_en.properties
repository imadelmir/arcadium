# --- Application errors (thrown by AuthService as ApiException) ---
error.username.taken=Username already in use
error.email.taken=Email already in use
error.credentials.invalid=Invalid credentials

# --- Access denied (JwtAuthenticationEntryPoint) ---
error.auth.required=Authentication required

# --- General message shown alongside validation errors (400) ---
error.validation=The request contains one or more invalid fields

# --- Validation: GENERIC per-constraint codes (last-resort fallback) ---
NotBlank=This field is required
Email=The email address is not valid
Size=Invalid field length
Pattern=Invalid field format

# --- Validation: field-SPECIFIC codes (take precedence) ---
NotBlank.registerRequest.username=Username is required
NotBlank.registerRequest.email=Email is required
NotBlank.registerRequest.password=Password is required
NotBlank.loginRequest.username=Username is required
NotBlank.loginRequest.password=Password is required
Email.registerRequest.email=The email address is not valid
Size.registerRequest.password=Password must be between 8 and 100 characters
Size.password=Password must be between 8 and 100 characters
Pattern.registerRequest.preferredLanguage=Preferred language must be 'it' or 'en'
Pattern.preferredLanguage=Preferred language must be 'it' or 'en'