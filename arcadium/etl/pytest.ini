[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Di default esegue solo i test veloci (senza database).
# Per i test che richiedono PostgreSQL:  python -m pytest -m database
addopts = -m "not database"
markers =
    database: test che richiedono una connessione a PostgreSQL (database arcadium_test)
